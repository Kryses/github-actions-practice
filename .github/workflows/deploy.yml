name: "Lint, Test & Deploy on push"
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Get Code"
        uses: actions/checkout@v3
      - name: "Install Requirements"
        run: npm ci
      - name: "Run Lint"
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: "Get Code"
        uses: actions/checkout@v3
      - name: "Install Requirements"
        run: npm ci
      - name: "Run Test"
        run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: "Get Code"
        uses: actions/checkout@v3
      - name: "Install Requirements"
        run: npm ci
      - name: "Run Build"
        run: npm build
      - name: "Run Deploy"
        run: echo "Deploying Code"
